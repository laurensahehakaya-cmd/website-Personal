<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Toko Kopi Enzo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <body class="login-body">

    <div class="login-container">
        <!-- Logo / Branding -->
        <div class="login-logo">
            ☕ Toko Kopi Enzo
        </div>
        
        <h2>Login Admin</h2>
        <p>Silakan masuk untuk mengelola toko.</p>
        
        <!-- Pesan Error (Disembunyikan dulu) -->
        <div id="pesanError" class="pesan-error"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Masukkan password" required>
                    <span class="toggle-password" onclick="togglePassword()">👁️</span>
                </div>
            </div>

            <!-- Ingat Saya & Lupa Password -->
            <div class="login-options">
                <label class="remember-me">
                    <input type="checkbox" id="ingatSaya"> Ingat Saya
                </label>
                <a href="#" class="lupa-password" onclick="alert('Fitur ini belum tersedia. Silakan hubungi admin.')">Lupa Password?</a>
            </div>

            <button type="submit" class="btn">Masuk</button>
        </form>

        <!-- Link Kembali ke Toko -->
        <a href="mark1.html" class="kembali-link">← Kembali ke Toko</a>
    </div>

</body>

    <script src="script.js"></script>
</body>
</html>
